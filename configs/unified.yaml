model_path: "yolov8m.pt"
detect_classes: [0, 1, 2, 3, 5, 7, 13, 24, 25, 26, 28, 56, 57, 58, 60, 62, 63, 68, 69, 72]  # person, bicycle, car, motorcycle, bus, truck, bench, backpack, umbrella, handbag, suitcase, chair, couch, potted plant, dining table, tv, laptop, microwave, oven, refrigerator

# Class grouping configuration - merge similar classes to improve tracking consistency
# Maps multiple COCO classes to a single unified class ID for detection and tracking
class_grouping:
  24: 24  # backpack (primary - all bag types will be mapped to this)
  26: 24  # handbag -> backpack
  28: 24  # suitcase -> backpack
  56: 56  # chair (primary - all seating furniture will be mapped to this)
  57: 56  # couch -> chair
  68: 68  # microwave (primary - all cooking appliances will be mapped to this)
  69: 68  # oven -> microwave

# Per-class detection parameters
# Class-specific parameters override the default values
class_parameters:
  0:  # persons
    conf: 0.45  # Higher confidence threshold for persons
    min_box_area: 10  # Smaller minimum box area for persons
  default:  # all other classes
    conf: 0.20  # Lower confidence threshold for objects
    min_box_area: 30  # Larger minimum box area for objects

# Global YOLO detection parameters
iou: 0.4  # NMS IoU threshold

# ByteTrack parameters
track_thresh: 0.3
match_thresh: 0.9
track_buffer: 180
aspect_ratio_thresh: 3.0
min_box_area: 30  # Global fallback for ByteTrack (overridden by class_parameters during detection)

# Trajectory storage configuration
trajectory_storage:
  enable: true  # Set to true to enable trajectory storage
  output_dir: "data/trajectories"
  export_format: "json"  # Options: "json", "csv", "both"
  export_frequency: 100  # Export every N frames for memory management
  max_memory_tracks: 1000  # Maximum tracks to keep in memory

# Trajectory visualization configuration
trajectory_visualization:
  enable: true  # Enable trajectory drawing on video
  tail_length: 200  # Number of historical points to display
  thickness: 2  # Line thickness for trajectory paths
  fade: true  # Apply fading effect to older points

# Co-movement detection configuration
comovement_detection:
  enable: true  # Set to true to enable person-object association detection
  proximity_threshold: 100  # Maximum distance (pixels) between centers for association
  min_frames: 5  # Minimum consecutive frames to confirm association
  max_gap_frames: 10  # Maximum frames allowed with broken proximity before clearing association
  visualization:
    draw_connections: true  # Draw lines connecting associated objects
    connection_color: [0, 255, 0]  # Green color for connections (BGR format)
    connection_thickness: 2  # Line thickness for connections
    highlight_boxes: true  # Highlight associated boxes with additional border
    show_labels: true  # Show association labels on video
  logging:
    print_events: true  # Print association events to console
    log_to_file: false  # Save association events to file
    log_file_path: "data/comovement_log.txt"  # Path for log file if enabled
